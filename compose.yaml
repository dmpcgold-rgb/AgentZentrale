services:
  agentzentrale:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8787/health',r=>process.exit(r.statusCode===401?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
      - server/.env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      WESTBAHN_PYTHON: /opt/agent-venv/bin/python
      WESTBAHN_BROWSER_PROFILE: /app/server/data/westbahn-browser
      WESTBAHN_LEDGER: /app/server/data/westbahn.json
    ports:
      - "127.0.0.1:8787:8787"
      # Temporary private desktop; accessible on the host only via SSH tunnel.
      - "127.0.0.1:6080:6080"
    volumes:
      - agent-data:/app/server/data
    shm_size: "1gb"
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  agent-data:
