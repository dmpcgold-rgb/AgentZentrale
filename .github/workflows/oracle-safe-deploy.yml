name: Oracle AgentZentrale - safe manual deployment
on:
  push:
    branches: [main]
    paths:
      - scripts/oracle-source-inventory.sh
      - scripts/oracle-private-reconcile.sh
      - scripts/oracle-snapshot-audit.sh
      - scripts/oracle-private-stage.py
      - scripts/oracle-private-build-preview.sh
      - scripts/oracle-production-release-gate.sh
      - scripts/oracle-controlled-rollout.sh
      - scripts/oracle-westbahn-booking-status.sh
      - scripts/oracle-booking-code-sync.py
      - scripts/oracle-booking-build-diagnose.py scripts/oracle-westbahn-integration-audit.py
      - scripts/oracle-westbahn-integration-audit.py
      - scripts/oracle-westbahn-book-three.sh
      - .github/workflows/oracle-safe-deploy.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Check-only, or deploy after all protections pass"
        type: choice
        options: [inventory, snapshot, reconcile, audit, stage, preview, verify, release-check, rollout, booking-status, booking-enable, booking-update, booking-diagnose, integration-audit, check, apply]
        default: check
permissions:
  contents: read
concurrency:
  group: oracle-agentzentrale-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment shell
        run: |
          bash -n scripts/oracle-safe-deploy.sh
          bash -n scripts/oracle-source-inventory.sh
          bash -n scripts/oracle-private-reconcile.sh
          bash -n scripts/oracle-snapshot-audit.sh
          bash -n scripts/oracle-private-build-preview.sh
          bash -n scripts/oracle-production-release-gate.sh
          bash -n scripts/oracle-controlled-rollout.sh
          bash -n scripts/oracle-westbahn-booking-status.sh
          bash -n scripts/oracle-westbahn-book-three.sh
          python3 -m py_compile scripts/oracle-audit-report.py scripts/oracle-private-stage.py scripts/oracle-booking-code-sync.py scripts/oracle-booking-build-diagnose.py
          python3 -m unittest discover -s tests -p test_oracle_audit_report.py -v
      - name: Verify public Node booking logic before remote build
        run: |
          node --version
          node --check server/index.mjs
          node --check server/westbahn.mjs
          node --check server/gmail-audit.mjs
          node --test server/tests/gmail-audit.test.mjs server/tests/westbahn.test.mjs
      - name: Verify checkout is not silently rebuilt
        run: |
          test -f scripts/oracle-safe-deploy.sh
          grep -q 'git_safe ls-files --error-unmatch' scripts/oracle-safe-deploy.sh
          grep -q 'git_safe status --porcelain' scripts/oracle-safe-deploy.sh
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Oracle SSH secrets exist
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          test -n "$ORACLE_HOST" && test -n "$ORACLE_SSH_KEY" && test -n "$ORACLE_KNOWN_HOSTS" || {
            echo "Missing SSH secrets. Configure them in repo Actions secrets."; exit 1;
          }
      - name: Run guarded Oracle deployment
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          MODE: ${{ inputs.mode || (contains(github.event.head_commit.message, '[oracle-integration-audit-once]') && 'integration-audit') || (contains(github.event.head_commit.message, '[oracle-booking-diagnose-once]') && 'booking-diagnose') || (contains(github.event.head_commit.message, '[oracle-booking-update-once]') && 'booking-update') || (contains(github.event.head_commit.message, '[oracle-booking-enable-once]') && 'booking-enable') || (contains(github.event.head_commit.message, '[oracle-booking-check-once]') && 'booking-status') || (contains(github.event.head_commit.message, '[oracle-rollout-once]') && 'rollout') || 'verify' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_deploy
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          user="${ORACLE_USER:-ubuntu}"
          script="scripts/oracle-safe-deploy.sh"
          if [[ "$MODE" == inventory || "$MODE" == snapshot ]]; then
            script="scripts/oracle-source-inventory.sh"
          elif [[ "$MODE" == reconcile ]]; then
            script="scripts/oracle-private-reconcile.sh"
          elif [[ "$MODE" == audit ]]; then
            script="scripts/oracle-snapshot-audit.sh"
          elif [[ "$MODE" == stage ]]; then
            script="scripts/oracle-private-stage.py"
          elif [[ "$MODE" == preview ]]; then
            script="scripts/oracle-private-build-preview.sh"
          elif [[ "$MODE" == release-check ]]; then
            script="scripts/oracle-production-release-gate.sh"
          elif [[ "$MODE" == rollout ]]; then
            script="scripts/oracle-controlled-rollout.sh"
          elif [[ "$MODE" == booking-status || "$MODE" == booking-enable ]]; then
            script="scripts/oracle-westbahn-booking-status.sh"
          fi
          remote_command="sudo -n bash -s -- --$MODE"
          if [[ "$MODE" == stage ]]; then
            remote_command="sudo -n python3 - --stage"
          elif [[ "$MODE" == preview ]]; then
            remote_command="sudo -n bash -s -- --preview"
          fi
          set +e
          if [[ "$MODE" == integration-audit ]]; then
            script64="$(base64 -w0 scripts/oracle-westbahn-integration-audit.py)"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
              "sudo -n python3 -c 'import base64;exec(compile(base64.b64decode(\"$script64\"),\"audit\",\"exec\"))' --integration-audit" \
              | tee "$RUNNER_TEMP/oracle-command.log"
            status=${PIPESTATUS[0]}
          elif [[ "$MODE" == booking-diagnose ]]; then
            script64="$(base64 -w0 scripts/oracle-booking-build-diagnose.py)"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
              "sudo -n python3 -c 'import base64;exec(compile(base64.b64decode(\"$script64\"),\"diagnose\",\"exec\"))' --booking-diagnose" \
              | tee "$RUNNER_TEMP/oracle-command.log"
            status=${PIPESTATUS[0]}
          elif [[ "$MODE" == booking-update ]]; then
            script64="$(base64 -w0 scripts/oracle-booking-code-sync.py)"
            set +e
            git ls-files -z -- Dockerfile package.json server src/core |
              grep -zE '^(Dockerfile|package[.]json|server/.*[.](mjs|js|json|py|txt|html|css)|src/core/.*[.](mjs|js|json))$' |
              grep -zEv '(^|/)[.]|(^|/)data/|(^|/)checkout_|ticketshop_station_dry_run' |
              tar --null -T - -cf - |
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
                "sudo -n python3 -c 'import base64;exec(compile(base64.b64decode(\"$script64\"),\"sync\",\"exec\"))' --booking-code-sync" \
              | tee "$RUNNER_TEMP/oracle-command.log"
            status=${PIPESTATUS[4]}
            if [[ "$status" -eq 0 ]]; then
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
                "sudo -n bash -s -- --preview" \
                < scripts/oracle-private-build-preview.sh | tee -a "$RUNNER_TEMP/oracle-command.log"
              status=${PIPESTATUS[0]}
              if [[ "$status" -eq 0 ]]; then echo BOOKING_TESTS=PASS | tee -a "$RUNNER_TEMP/oracle-command.log"; fi
              if [[ "$status" -ne 0 ]]; then
                # On failed build, print sanitized failure categories in the SAME run.
                diag64="$(base64 -w0 scripts/oracle-booking-build-diagnose.py)"
                ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
                  -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
                  "sudo -n python3 -c 'import base64;exec(compile(base64.b64decode(\"$diag64\"),\"diagnose\",\"exec\"))' --booking-diagnose" \
                  | tee -a "$RUNNER_TEMP/oracle-command.log" || true
              fi
            fi
            if [[ "$status" -eq 0 ]]; then
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
                "sudo -n bash -s -- --rollout" \
                < scripts/oracle-controlled-rollout.sh | tee -a "$RUNNER_TEMP/oracle-command.log"
              status=${PIPESTATUS[0]}
            fi
            if [[ "$status" -eq 0 ]]; then
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
                "sudo -n bash -s -- --booking-status" \
                < scripts/oracle-westbahn-booking-status.sh | tee -a "$RUNNER_TEMP/oracle-command.log"
              status=${PIPESTATUS[0]}
            fi
            if [[ "$status" -eq 0 ]]; then
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
                "sudo -n bash -s -- --booking-three" \
                < scripts/oracle-westbahn-book-three.sh | tee -a "$RUNNER_TEMP/oracle-command.log"
              status=${PIPESTATUS[0]}
            fi
          elif [[ "$MODE" == verify ]]; then
            # A single run must first rebuild the exact private candidate
            # and only then check its fingerprint against the staged source.
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
              "sudo -n bash -s -- --preview" \
              < scripts/oracle-private-build-preview.sh | tee "$RUNNER_TEMP/oracle-command.log"
            status=${PIPESTATUS[0]}
            if [[ "$status" -eq 0 ]]; then
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
                -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
                "sudo -n bash -s -- --release-check" \
                < scripts/oracle-production-release-gate.sh | tee -a "$RUNNER_TEMP/oracle-command.log"
              status=${PIPESTATUS[0]}
            fi
          else
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/oracle_deploy "$user@$ORACLE_HOST" \
              "$remote_command" < "$script" | tee "$RUNNER_TEMP/oracle-command.log"
            status=${PIPESTATUS[0]}
          fi
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/oracle-command-status"
          exit "$status"
      - name: Generate sanitized audit report
        if: always()
        env:
          MODE: ${{ inputs.mode || (contains(github.event.head_commit.message, '[oracle-integration-audit-once]') && 'integration-audit') || (contains(github.event.head_commit.message, '[oracle-booking-diagnose-once]') && 'booking-diagnose') || (contains(github.event.head_commit.message, '[oracle-booking-update-once]') && 'booking-update') || (contains(github.event.head_commit.message, '[oracle-booking-enable-once]') && 'booking-enable') || (contains(github.event.head_commit.message, '[oracle-booking-check-once]') && 'booking-status') || (contains(github.event.head_commit.message, '[oracle-rollout-once]') && 'rollout') || 'verify' }}
        run: |
          python3 scripts/oracle-audit-report.py \
            "$RUNNER_TEMP/oracle-command.log" \
            "$RUNNER_TEMP/oracle-command-status" \
            "$RUNNER_TEMP/oracle-audit-report.json"
          echo '### Oracle audit (sanitized)' >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,sys; a=json.load(open(sys.argv[1])); print("Mode: **"+a["workflow_mode"]+"**"); print("Status: **"+a["status"]+"**"); print("Remote exit: **"+str(a["remote_command_exit_code"])+"**"); print("Checks:"); [print("- "+k+": "+str(v)) for k,v in sorted(a["checks"].items())]' "$RUNNER_TEMP/oracle-audit-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-audit-report-${{ github.run_id }}
          path: ${{ runner.temp }}/oracle-audit-report.json
          if-no-files-found: error
          retention-days: 30
