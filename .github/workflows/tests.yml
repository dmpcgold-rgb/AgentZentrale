name: AgentZentrale tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v test_worker.py test_dynamic_checkout_guard.py test_dynamic_checkout_dom.py test_checkout_guard.py
        working-directory: server/browser

  dynamic-checkout-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify isolated zero-euro checkout DOM without provider requests
        run: python -m unittest -v test_dynamic_checkout_guard.py test_dynamic_checkout_dom.py test_checkout_guard.py
        working-directory: server/browser
