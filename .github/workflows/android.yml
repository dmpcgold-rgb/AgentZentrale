name: Build Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'index.js'
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.cjs'
      - '.github/workflows/android.yml'
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Normalize incomplete Expo Android publication metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          let fixed = 0;
          function visit(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!entry.isDirectory() || entry.isSymbolicLink() || entry.name.startsWith('.')) continue;
              const folder = path.join(dir, entry.name);
              const file = path.join(folder, 'expo-module.config.json');
              if (fs.existsSync(file)) {
                const config = JSON.parse(fs.readFileSync(file, 'utf8'));
                let changed = false;
                function fix(value) {
                  if (!value || typeof value !== 'object') return;
                  if (value.publication && !value.publication.version) {
                    // SDK 57 Gradle requires a version even for source-built projects.
                    // Drop incomplete prebuilt metadata, keeping native source autolinking.
                    delete value.publication;
                    delete value.shouldUsePublicationScriptPath;
                    changed = true;
                  }
                  for (const child of Object.values(value)) fix(child);
                }
                fix(config.android);
                if (changed) {
                  fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
                  console.log('Using Android source for:', folder);
                  fixed++;
                }
              }
              // Only traverse package scopes and nested dependencies.
              if (entry.name.startsWith('@')) visit(folder);
              const nested = path.join(folder, 'node_modules');
              if (fs.existsSync(nested)) visit(nested);
            }
          }
          visit('node_modules');
          console.log('Incomplete module publications removed:', fixed);
          NODE
      - name: Run app and server tests
        run: npm test
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify Android APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/AgentZentrale-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgentZentrale-Android-test
          path: artifacts/AgentZentrale-test.apk
          if-no-files-found: error
          retention-days: 14
