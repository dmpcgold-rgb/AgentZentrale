name: Build Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'index.js'
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.cjs'
      - '.github/workflows/android.yml'
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Run app and server tests
        run: npm test
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify Android APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/AgentZentrale-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgentZentrale-Android-test
          path: artifacts/AgentZentrale-test.apk
          if-no-files-found: error
          retention-days: 14
