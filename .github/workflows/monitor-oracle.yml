name: Monitor Oracle AgentZentrale

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-monitor
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    environment: oracle-production
    timeout-minutes: 5
    steps:
      - name: Prepare SSH access
        env:
          HOST: ${{ secrets.ORACLE_SSH_HOST }}
          KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$HOST_KEY" || { echo "Missing Oracle SSH secrets"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$KEY" | base64 --decode > ~/.ssh/oracle_deploy
          chmod 600 ~/.ssh/oracle_deploy
          ssh-keygen -y -f ~/.ssh/oracle_deploy > /dev/null
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Check Docker and gateway
        env:
          HOST: ${{ secrets.ORACLE_SSH_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "ubuntu@$HOST" 'set -eu
            sudo docker compose -f /opt/agentzentrale/compose.yaml ps --status running --services | grep -Fx agentzentrale
            status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8787/)
            test "$status" = 401 || { echo "Unexpected gateway HTTP status: $status"; exit 1; }
            echo "Oracle AgentZentrale OK: container running; gateway HTTP 401 (authentication required)"
          '
