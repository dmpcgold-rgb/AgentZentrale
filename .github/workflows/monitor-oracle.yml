name: Monitor Oracle AgentZentrale

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-monitor
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    environment: oracle-production
    timeout-minutes: 8
    steps:
      - name: Prepare SSH access
        env:
          HOST: ${{ secrets.ORACLE_SSH_HOST }}
          KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$HOST_KEY" || { echo "Missing Oracle SSH secrets"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$KEY" | base64 --decode > ~/.ssh/oracle_deploy
          chmod 600 ~/.ssh/oracle_deploy
          ssh-keygen -y -f ~/.ssh/oracle_deploy > /dev/null
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Check health and attempt rate-limited recovery
        env:
          HOST: ${{ secrets.ORACLE_SSH_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "ubuntu@$HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          exec 9>/var/lock/agentzentrale-recovery.lock
          flock -w 20 9
          container=$(docker compose -f /opt/agentzentrale/compose.yaml ps -q agentzentrale)
          test -n "$container" || { echo "Container missing; manual intervention required"; exit 1; }
          state=$(docker inspect -f '{{.State.Status}}' "$container")
          health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")
          echo "Container state=$state health=$health"
          if [ "$state" != running ]; then
            echo "Container not running; Docker restart policy should handle crashes. Manual inspection required."
            exit 1
          fi
          if [ "$health" = healthy ]; then
            echo "AgentZentrale healthy; no action needed"
            exit 0
          fi
          if [ "$health" != unhealthy ]; then
            echo "Health state $health; waiting for Docker healthcheck or manual inspection"
            exit 1
          fi
          for attempt in 1 2 3; do
            sleep 10
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")
            echo "Confirmation $attempt/3: $health"
            if [ "$health" != unhealthy ]; then
              echo "Health changed; no automatic restart"
              test "$health" = healthy
              exit $?
            fi
          done
          stamp=/var/lib/agentzentrale-last-recovery
          now=$(date +%s)
          if [ -f "$stamp" ]; then
            last=$(cat "$stamp")
            if [[ "$last" =~ ^[0-9]+$ ]] && (( now - last < 1800 )); then
              echo "Recovery cooldown active; manual inspection required"
              exit 1
            fi
          fi
          printf '%s\n' "$now" > "$stamp"
          echo "Restarting unhealthy AgentZentrale container (one attempt)"
          docker restart "$container"
          for attempt in $(seq 1 18); do
            sleep 5
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")
            echo "Post-restart check $attempt/18: $health"
            if [ "$health" = healthy ]; then
              echo "Recovery successful"
              exit 0
            fi
          done
          echo "Recovery unsuccessful; manual inspection required"
          exit 1
          REMOTE
